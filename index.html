<!DOCTYPE html>
<html lang="en" data-font="sans" data-density="compact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crate — Music Curation</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (via CDN for now — we'll swap this for a build step later) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Data (constants + empty TRACKS placeholder) -->
  <script src="js/data.js"></script>
  <script src="js/inbox-data.js"></script>

  <!-- Supabase fetch — populates window.TRACKS before React mounts -->
  <script>
    (function () {
      const SUPABASE_URL = 'https://hccuqyudoynaakzjklco.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjY3VxeXVkb3luYWFremprbGNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMTAxNzEsImV4cCI6MjA5NTU4NjE3MX0.WGPEwVu8Jwz-DCCG4nLDhV4zMa14TqnTH-HXxkVgOtI';

      window._supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // Fetches all tracks then fires a custom event so main.js knows data is ready
      window._loadTracks = async function () {
        try {
          const { data, error } = await window._supabase
            .from('tracks')
            .select('*')
            .order('date_heard', { ascending: false });

          if (error) throw error;

          // Map Supabase column names to the shape the app expects.
          // If your column names differ, adjust the left-hand side of each line.
          window.TRACKS = (data || []).map(row => ({
            id:           row.id,
            title:        row.title,
            artist:       row.artist,
            year:         row.year,
            label:        row.label        || '—',
            genre:        row.genre        || '—',
            bpm:          row.bpm          ?? null,
            key:          row.key          ?? null,
            source:       row.source       || 'mix',
            sourceDetail: row.source_detail || '',
            mood:         row.mood         || '',
            dateHeard:    row.date_heard   || '',
            notes:        row.notes        || '',
            owned:        row.owned        ?? false,
            prices: {
              discogs:  row.price_discogs  ?? null,
              bandcamp: row.price_bandcamp ?? null,
              beatport: row.price_beatport ?? null,
            },
          }));
        } catch (err) {
          console.error('[Crate] Failed to load tracks from Supabase:', err);
          window.TRACKS = [];
        }

        // Signal that data is ready — main.js listens for this before mounting
        window._crateReady = true;
        document.dispatchEvent(new Event('crate:ready'));
      };

      window._loadTracks();
    })();
  </script>

  <!-- Components (order matters — dependencies first) -->
  <script type="text/babel" src="js/App.js"></script>
  <script type="text/babel" src="js/Library.js"></script>
  <script type="text/babel" src="js/Inbox.js"></script>
  <script type="text/babel" src="js/Drawer.js"></script>
  <script type="text/babel" src="js/Playlists.js"></script>
  <script type="text/babel" src="js/main.js"></script>
</body>
</html>
